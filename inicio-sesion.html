<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Hostal Casa del Sol</title>
  <meta name="description" content="Accede a tu cuenta para gestionar tus reservas en Casa del Sol." />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#8b5e34', 'primary-light': '#c08552', 'primary-dark': '#6b4423',
            secondary: '#3d5f3d', accent: '#d4a574',
            'background-light': '#faf6f1', 'background-cream': '#f3ead9', 'background-soft': '#ede0ce',
            'background-dark': '#2c1f15', muted: '#6b5d4f', border: '#e0d2bd'
          },
          fontFamily: { display: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="login" class="bg-background-light text-gray-800 font-sans">

  <div id="appHeader"></div>

  <main class="min-h-[calc(100vh-80px)] flex items-center py-12">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center max-w-6xl mx-auto">

        <!-- ILUSTRACIÓN -->
        <div class="hidden lg:block relative">
          <div class="aspect-square rounded-3xl overflow-hidden shadow-2xl">
            <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=900&q=85&auto=format&fit=crop" alt="Bienvenido a Casa del Sol" class="w-full h-full object-cover"/>
          </div>
          <div class="absolute -bottom-6 -right-6 bg-white p-6 rounded-xl shadow-xl max-w-[260px] border-2 border-accent">
            <p class="font-display text-2xl font-bold text-primary">★ 4.9/5</p>
            <p class="text-muted text-sm mt-1">Más de 2,000 huéspedes felices nos recomiendan</p>
          </div>
        </div>

        <!-- FORMULARIO -->
        <div class="max-w-md w-full mx-auto">
          <div class="text-center mb-8">
            <p class="text-primary uppercase tracking-[0.3em] text-xs mb-3 font-semibold">Bienvenido de vuelta</p>
            <h1 class="text-4xl font-bold text-primary-dark font-display">Inicia sesión</h1>
            <p class="text-muted mt-3">Accede para gestionar tus reservas</p>
          </div>

          <form id="loginForm" class="space-y-5">
            <div>
              <label class="block text-sm font-semibold text-muted mb-2">Email</label>
              <div class="relative">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-muted">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/></svg>
                </span>
                <input type="email" name="email" required placeholder="tu@email.com" class="input-field pl-11"/>
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between mb-2">
                <label class="block text-sm font-semibold text-muted">Contraseña</label>
                <a href="recuperar-password.html" class="text-sm text-primary hover:underline font-medium">¿Olvidaste?</a>
              </div>
              <div class="relative">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-muted">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </span>
                <input type="password" name="password" required placeholder="••••••" class="input-field pl-11" id="passwordInput"/>
                <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-primary">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <input type="checkbox" id="recordarme" class="checkbox-custom"/>
              <label for="recordarme" class="text-sm text-muted">Recordarme</label>
            </div>

            <button type="submit" class="btn-primary w-full py-3.5 text-base">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
              Iniciar sesión
            </button>

            <div class="relative my-6">
              <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-soft"></div></div>
              <div class="relative flex justify-center text-sm"><span class="px-4 bg-background-light text-muted">o continuar con</span></div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <button type="button" class="btn-outline text-sm py-3">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Google
              </button>
              <button type="button" class="btn-outline text-sm py-3">
                <svg class="w-5 h-5" fill="#1877F2" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                Facebook
              </button>
            </div>

            <p class="text-center text-sm text-muted mt-6">
              ¿No tienes cuenta? <a href="registro.html" class="text-primary font-semibold hover:underline">Regístrate aquí</a>
            </p>
          </form>

          <div class="mt-6 p-4 bg-background-soft rounded-lg border border-soft text-xs text-muted">
            <p class="font-semibold text-primary-dark mb-1">💡 Cuentas de demostración:</p>
            <p>ana@test.com / 123456 — luis@test.com / 123456</p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div id="appFooter"></div>

  <script src="main.js"></script>
  <script>
    function initLogin() {
      if (Auth.current()) {
        window.location.href = 'perfil.html';
        return;
      }

      document.getElementById('togglePassword').addEventListener('click', () => {
        const $input = document.getElementById('passwordInput');
        $input.type = $input.type === 'password' ? 'text' : 'password';
      });

      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = e.target.email.value.trim();
        const password = e.target.password.value;
        const result = Auth.login(email, password);
        if (result.ok) {
          UI.Toast('Bienvenido/a de vuelta', 'success');
          const redirect = UI.getURLParam('redirect') || 'perfil.html';
          setTimeout(() => window.location.href = redirect, 600);
        } else {
          UI.Toast(result.error, 'error');
        }
      });
    }
  </script>
</body>
</html>
