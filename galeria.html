<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galería · Hostal Casa del Sol</title>
  <meta name="description" content="Recorre visualmente Casa del Sol: habitaciones, áreas comunes, terraza y todas las comodidades." />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#8b5e34', 'primary-light': '#c08552', 'primary-dark': '#6b4423',
            secondary: '#3d5f3d', accent: '#d4a574',
            'background-light': '#faf6f1', 'background-cream': '#f3ead9', 'background-soft': '#ede0ce',
            'background-dark': '#2c1f15', muted: '#6b5d4f', border: '#e0d2bd'
          },
          fontFamily: { display: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="galeria" class="bg-background-light text-gray-800 font-sans">

  <div id="appHeader"></div>

  <main>

    <!-- HERO -->
    <section class="relative h-[40vh] flex items-center gradient-overlay hero-fallback" style="background-image: url('https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=1600&q=85&auto=format&fit=crop'); background-size: cover; background-position: center; background-color: #2c1f15;">
      <div class="relative z-10 container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="max-w-3xl">
          <p class="text-accent uppercase tracking-[0.3em] text-sm mb-3 font-semibold">Galería</p>
          <h1 class="text-5xl md:text-6xl font-black text-white leading-[1.05] font-display">Descubre nuestro<br/>espacio</h1>
        </div>
      </div>
    </section>

    <!-- GALERÍA -->
    <section class="py-16">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-wrap gap-3 mb-10 justify-center" id="galeriaFilters">
          <button class="btn-primary text-sm px-5 py-2" data-filter="all">Todas</button>
          <button class="btn-outline text-sm px-5 py-2" data-filter="habitaciones">Habitaciones</button>
          <button class="btn-outline text-sm px-5 py-2" data-filter="comunes">Áreas comunes</button>
          <button class="btn-outline text-sm px-5 py-2" data-filter="servicios">Servicios</button>
        </div>
        <div id="galeriaGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
      </div>
    </section>

    <!-- CTA -->
    <section class="py-16 bg-background-cream">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <h2 class="text-3xl md:text-4xl font-bold text-primary-dark font-display mb-4">¿Te gustó lo que viste?</h2>
        <p class="text-muted mb-8 max-w-xl mx-auto">Reserva ahora y vive la experiencia Casa del Sol.</p>
        <a href="reserva.html" class="btn-primary text-base px-8 py-4">Reservar mi habitación</a>
      </div>
    </section>

  </main>

  <div id="appFooter"></div>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox">
    <div class="lightbox-close" id="lightboxClose">×</div>
    <img id="lightboxImg" src="" alt=""/>
  </div>

  <script src="main.js"></script>
  <script>
    const GALERIA_ITEMS = [
      { src: 'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1200&q=85&auto=format&fit=crop', cat: 'habitaciones', title: 'Habitación doble' },
      { src: 'https://images.unsplash.com/photo-1555854877-bab0e564b8d5?w=1200&q=85&auto=format&fit=crop', cat: 'habitaciones', title: 'Dormitorio compartido' },
      { src: 'https://images.unsplash.com/photo-1611892440504-42a792e24d32?w=1200&q=85&auto=format&fit=crop', cat: 'habitaciones', title: 'Habitación matrimonial' },
      { src: 'https://images.unsplash.com/photo-1590490360182-c33d57733427?w=1200&q=85&auto=format&fit=crop', cat: 'habitaciones', title: 'Habitación twin' },
      { src: 'https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=1200&q=85&auto=format&fit=crop', cat: 'habitaciones', title: 'Habitación single' },
      { src: 'https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=1200&q=85&auto=format&fit=crop', cat: 'habitaciones', title: 'Habitación privada' },
      { src: 'https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?w=1200&q=85&auto=format&fit=crop', cat: 'comunes', title: 'Recepción' },
      { src: 'https://images.unsplash.com/photo-1564501049412-61c2a3083791?w=1200&q=85&auto=format&fit=crop', cat: 'comunes', title: 'Terraza exterior' },
      { src: 'https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=1200&q=85&auto=format&fit=crop', cat: 'comunes', title: 'Sala de estar' },
      { src: 'https://images.unsplash.com/photo-1540541338287-41700207dee6?w=1200&q=85&auto=format&fit=crop', cat: 'comunes', title: 'Lobby' },
      { src: 'https://images.unsplash.com/photo-1559339352-11d035aa65de?w=1200&q=85&auto=format&fit=crop', cat: 'servicios', title: 'Cocina común' },
      { src: 'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=1200&q=85&auto=format&fit=crop', cat: 'servicios', title: 'Restaurante' },
      { src: 'https://images.unsplash.com/photo-1521587760476-6c12a4b040da?w=1200&q=85&auto=format&fit=crop', cat: 'servicios', title: 'Coworking' },
      { src: 'https://images.unsplash.com/photo-1571902943202-507ec2618e8f?w=1200&q=85&auto=format&fit=crop', cat: 'servicios', title: 'Área de trabajo' },
      { src: 'https://images.unsplash.com/photo-1571896349842-33c89424de2d?w=1200&q=85&auto=format&fit=crop', cat: 'comunes', title: 'Jardín interior' },
      { src: 'https://images.unsplash.com/photo-1540541338287-41700207dee6?w=1200&q=85&auto=format&fit=crop', cat: 'habitaciones', title: 'Baño privado' }
    ];

    function initGaleria() {
      const $grid = document.getElementById('galeriaGrid');
      const $lightbox = document.getElementById('lightbox');
      const $lightboxImg = document.getElementById('lightboxImg');
      const $close = document.getElementById('lightboxClose');

      const render = (filter = 'all') => {
        const items = filter === 'all' ? GALERIA_ITEMS : GALERIA_ITEMS.filter(g => g.cat === filter);
        $grid.innerHTML = items.map(g => `
          <div class="gallery-item" data-src="${g.src}" data-title="${g.title}">
            <img src="${g.src}" alt="${g.title}" loading="lazy"/>
          </div>
        `).join('');
        $grid.querySelectorAll('.gallery-item').forEach(item => {
          item.addEventListener('click', () => {
            $lightboxImg.src = item.dataset.src;
            $lightbox.classList.add('active');
          });
        });
      };

      render('all');

      document.querySelectorAll('#galeriaFilters button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#galeriaFilters button').forEach(b => {
            b.classList.remove('btn-primary');
            b.classList.add('btn-outline');
          });
          btn.classList.remove('btn-outline');
          btn.classList.add('btn-primary');
          render(btn.dataset.filter);
        });
      });

      $close.addEventListener('click', () => $lightbox.classList.remove('active'));
      $lightbox.addEventListener('click', (e) => {
        if (e.target === $lightbox) $lightbox.classList.remove('active');
      });
    }
  </script>
</body>
</html>
