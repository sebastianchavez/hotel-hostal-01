<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle de reserva · Hostal Casa del Sol</title>
  <meta name="description" content="Detalle completo de tu reserva con opción de cancelación." />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#8b5e34', 'primary-light': '#c08552', 'primary-dark': '#6b4423',
            secondary: '#3d5f3d', accent: '#d4a574',
            'background-light': '#faf6f1', 'background-cream': '#f3ead9', 'background-soft': '#ede0ce',
            'background-dark': '#2c1f15', muted: '#6b5d4f', border: '#e0d2bd'
          },
          fontFamily: { display: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="detalle-reserva" class="bg-background-light text-gray-800 font-sans">

  <div id="appHeader"></div>

  <main class="py-10">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-5xl" id="detalleMain"></div>
  </main>

  <div id="appFooter"></div>

  <script src="main.js"></script>
  <script>
    function initDetalleReserva() {
      const session = Auth.requireAuth();
      if (!session) return;

      const id = UI.getURLParam('id');
      const reserva = id ? Reservas.byId(id) : null;

      if (!reserva || reserva.userId !== session.id) {
        document.getElementById('detalleMain').innerHTML = `
          <div class="card p-12 text-center">
            <svg class="w-16 h-16 mx-auto text-soft mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            <h2 class="text-2xl font-bold text-primary-dark mb-3">Reserva no encontrada</h2>
            <p class="text-muted mb-6">Esta reserva no existe o no te pertenece.</p>
            <a href="perfil.html#reservas" class="btn-primary">Volver a mis reservas</a>
          </div>
        `;
        return;
      }

      const hab = HABITACIONES.find(h => h.id === reserva.habitacionId);
      const noches = Reservas.calcularNoches(reserva.fechaEntrada, reserva.fechaSalida);
      const datosH = reserva.datosHuesped || {};
      const puedeCancelar = Reservas.puedeCancelarse(reserva);
      const requierePago = Reservas.requierePago(reserva);

      const acciones = () => {
        if (requierePago) {
          return `
            <div class="flex flex-col sm:flex-row gap-3">
              <a href="pago.html?id=${reserva.id}" class="btn-primary flex-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
                Ir a pagar ahora
              </a>
              ${puedeCancelar ? `<button id="btnCancelar" class="btn-outline text-red-600 border-red-400 hover:bg-red-50 hover:border-red-600">Cancelar reserva</button>` : ''}
            </div>
          `;
        }
        if (reserva.estado === 'confirmada' || reserva.estado === 'pendiente') {
          if (puedeCancelar) {
            return `<button id="btnCancelar" class="btn-outline text-red-600 border-red-400 hover:bg-red-50 hover:border-red-600">Cancelar reserva</button>`;
          }
        }
        return '';
      };

      document.getElementById('detalleMain').innerHTML = `
        <div class="mb-6 flex items-center justify-between">
          <a href="perfil.html#reservas" class="btn-ghost text-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            Volver a mis reservas
          </a>
          <span class="badge-estado badge-${reserva.estado}">${Reservas.estadoLabel(reserva.estado)}</span>
        </div>

        <!-- HERO -->
        <div class="card overflow-hidden mb-8">
          <div class="aspect-[21/9] relative">
            <img src="${hab.imagen}" alt="${hab.nombre}" class="w-full h-full object-cover"/>
            <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>
            <div class="absolute bottom-0 left-0 right-0 p-6 text-white">
              <p class="text-xs uppercase tracking-widest text-accent mb-1">${hab.tipo === 'privada' ? 'Habitación privada' : 'Dormitorio compartido'}</p>
              <h1 class="font-display text-4xl font-bold">${hab.nombre}</h1>
              <p class="text-sm text-gray-200 mt-1">Reserva #${reserva.id}</p>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

          <div class="lg:col-span-2 space-y-6">

              <!-- DATOS HUÉSPED -->
              <div class="card p-6">
                <h3 class="font-display text-xl font-bold text-primary-dark mb-4">Datos del huésped</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                  <div><p class="text-muted text-xs">Nombre</p><p class="font-semibold">${datosH.nombre || session.nombre}</p></div>
                  <div><p class="text-muted text-xs">Email</p><p class="font-semibold">${datosH.email || session.email}</p></div>
                  <div><p class="text-muted text-xs">Teléfono</p><p class="font-semibold">${datosH.telefono || session.telefono || '—'}</p></div>
                  <div><p class="text-muted text-xs">Documento</p><p class="font-semibold">${datosH.documento || '—'}</p></div>
                  ${datosH.notas ? `<div class="md:col-span-2"><p class="text-muted text-xs">Notas</p><p>${datosH.notas}</p></div>` : ''}
                </div>
              </div>

              <!-- DETALLE ESTANCIA -->
              <div class="card p-6">
                <h3 class="font-display text-xl font-bold text-primary-dark mb-4">Detalles de la estancia</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                  <div>
                    <p class="text-muted text-xs uppercase tracking-wider mb-1">Check-in</p>
                    <p class="font-display text-xl font-bold text-primary">${UI.formatDateShort(reserva.fechaEntrada)}</p>
                    <p class="text-xs text-muted">Desde 14:00</p>
                  </div>
                  <div>
                    <p class="text-muted text-xs uppercase tracking-wider mb-1">Check-out</p>
                    <p class="font-display text-xl font-bold text-primary">${UI.formatDateShort(reserva.fechaSalida)}</p>
                    <p class="text-xs text-muted">Hasta 11:00</p>
                  </div>
                  <div>
                    <p class="text-muted text-xs uppercase tracking-wider mb-1">Duración</p>
                    <p class="font-display text-xl font-bold text-primary">${noches}</p>
                    <p class="text-xs text-muted">${noches === 1 ? 'noche' : 'noches'}</p>
                  </div>
                  <div>
                    <p class="text-muted text-xs uppercase tracking-wider mb-1">Huéspedes</p>
                    <p class="font-display text-xl font-bold text-primary">${reserva.huespedes}</p>
                    <p class="text-xs text-muted">${reserva.huespedes === 1 ? 'persona' : 'personas'}</p>
                  </div>
                </div>
              </div>

              <!-- SERVICIOS EXTRA -->
              ${reserva.serviciosExtra && reserva.serviciosExtra.length > 0 ? `
                <div class="card p-6">
                  <h3 class="font-display text-xl font-bold text-primary-dark mb-4">Servicios adicionales</h3>
                  <ul class="space-y-2">
                    ${reserva.serviciosExtra.map(sid => {
                      const s = SERVICIOS_EXTRA.find(x => x.id === sid);
                      return s ? `
                        <li class="flex items-center justify-between py-2 border-b border-soft last:border-0">
                          <div>
                            <p class="font-semibold text-primary-dark">${s.nombre}</p>
                            <p class="text-xs text-muted">${s.descripcion}</p>
                          </div>
                          <p class="font-bold text-primary">${UI.formatCurrency(s.precio)}</p>
                        </li>
                      ` : '';
                    }).join('')}
                  </ul>
                </div>
              ` : ''}

              ${reserva.estado === 'cancelada' && reserva.motivoCancelacion ? `
                <div class="card p-6 bg-red-50 border border-red-200">
                  <h3 class="font-display text-lg font-bold text-red-700 mb-2">Reserva cancelada</h3>
                  <p class="text-sm text-red-700"><strong>Motivo:</strong> ${reserva.motivoCancelacion}</p>
                </div>
              ` : ''}

            </div>

            <!-- DESGLOSE DE PRECIOS -->
            <aside class="lg:col-span-1">
              <div class="card p-6 lg:sticky lg:top-24">
                <h3 class="font-display text-xl font-bold text-primary-dark mb-4">Desglose de precio</h3>
                <table class="w-full text-sm">
                  <tbody>
                    <tr class="border-b border-soft">
                      <td class="py-2 text-muted">${hab.nombre}</td>
                      <td class="py-2 text-right font-semibold text-xs">${UI.formatCurrency(hab.precio)}/noche</td>
                    </tr>
                    <tr class="border-b border-soft">
                      <td class="py-2 text-muted">${noches} ${noches === 1 ? 'noche' : 'noches'}</td>
                      <td class="py-2 text-right font-semibold">${UI.formatCurrency(hab.precio * noches)}</td>
                    </tr>
                    ${reserva.serviciosExtra && reserva.serviciosExtra.length > 0 ? reserva.serviciosExtra.map(sid => {
                      const s = SERVICIOS_EXTRA.find(x => x.id === sid);
                      return s ? `<tr class="border-b border-soft"><td class="py-2 text-muted">${s.nombre}</td><td class="py-2 text-right font-semibold">${UI.formatCurrency(s.precio)}</td></tr>` : '';
                    }).join('') : ''}
                    <tr>
                      <td class="pt-3 font-display font-bold text-primary-dark">Total</td>
                      <td class="pt-3 text-right font-display text-2xl font-bold text-primary">${UI.formatCurrency(reserva.total)}</td>
                    </tr>
                  </tbody>
                </table>

                ${reserva.pago ? `
                  <div class="divider"></div>
                  <div class="text-sm">
                    <p class="text-muted text-xs mb-2 uppercase tracking-wider">Información de pago</p>
                    <div class="flex justify-between py-1"><span class="text-muted">Método</span><span class="font-semibold">${reserva.pago.metodo}</span></div>
                    <div class="flex justify-between py-1"><span class="text-muted">Referencia</span><span class="font-mono text-xs">${reserva.pago.referencia}</span></div>
                    <div class="flex justify-between py-1"><span class="text-muted">Fecha</span><span>${UI.formatDate(reserva.pago.fechaPago)}</span></div>
                  </div>
                ` : `
                  <div class="divider"></div>
                  <div class="text-sm text-center py-3 bg-amber-50 rounded-lg border border-amber-200">
                    <p class="text-amber-800 font-semibold">⏳ Pago pendiente</p>
                    <p class="text-xs text-amber-700 mt-1">Completa el pago para confirmar la reserva.</p>
                  </div>
                `}

                <div class="mt-6 space-y-3">
                  ${acciones()}
                </div>

                ${reserva.estado !== 'cancelada' && reserva.estado !== 'completada' && !puedeCancelar ? `
                  <p class="text-xs text-muted mt-4 text-center">La cancelación solo es posible hasta 48h antes de la fecha de entrada.</p>
                ` : ''}
              </div>
            </aside>

        </div>
      `;

      const btnCancelar = document.getElementById('btnCancelar');
      if (btnCancelar) {
        btnCancelar.addEventListener('click', () => {
          UI.Modal({
            title: '¿Cancelar reserva?',
            content: `Estás a punto de cancelar tu reserva en ${hab.nombre}. Esta acción no se puede deshacer.<br/><br/><label class="block text-left text-sm font-semibold text-muted mb-1">Motivo de cancelación (opcional)</label><textarea id="motivoCancelacion" rows="3" class="input-field resize-none w-full mt-2" placeholder="Cuéntanos por qué cancelas..."></textarea>`,
            primaryText: 'Sí, cancelar',
            secondaryText: 'Volver',
            onPrimary: () => {
              const motivo = document.getElementById('motivoCancelacion')?.value.trim() || 'Sin especificar';
              Reservas.cancelar(reserva.id, motivo);
              UI.Toast('Reserva cancelada correctamente', 'success');
              setTimeout(() => location.reload(), 800);
            }
          });
        });
      }
    }
  </script>
</body>
</html>
