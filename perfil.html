<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi perfil · Hostal Casa del Sol</title>
  <meta name="description" content="Gestiona tu cuenta y consulta el historial de tus reservas en Casa del Sol." />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#8b5e34', 'primary-light': '#c08552', 'primary-dark': '#6b4423',
            secondary: '#3d5f3d', accent: '#d4a574',
            'background-light': '#faf6f1', 'background-cream': '#f3ead9', 'background-soft': '#ede0ce',
            'background-dark': '#2c1f15', muted: '#6b5d4f', border: '#e0d2bd'
          },
          fontFamily: { display: ['Playfair Display', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="perfil" class="bg-background-light text-gray-800 font-sans">

  <div id="appHeader"></div>

  <main class="py-10">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-6xl">

      <div class="text-center mb-10">
        <p class="text-primary uppercase tracking-[0.3em] text-xs mb-2 font-semibold">Mi cuenta</p>
        <h1 class="text-4xl md:text-5xl font-bold text-primary-dark font-display">Mi perfil</h1>
      </div>

      <!-- CARD DE USUARIO -->
      <div class="card p-6 md:p-8 mb-8 bg-gradient-to-br from-primary to-primary-dark text-white relative overflow-hidden">
        <div class="absolute top-0 right-0 opacity-10">
          <svg class="w-64 h-64" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg>
        </div>
        <div class="relative z-10 flex flex-col md:flex-row items-center gap-6">
          <img id="userFoto" src="" alt="" class="w-24 h-24 rounded-full object-cover border-4 border-white shadow-lg"/>
          <div class="flex-1 text-center md:text-left">
            <h2 id="userNombre" class="font-display text-3xl font-bold">—</h2>
            <p id="userEmail" class="text-gray-100 mt-1">—</p>
            <p id="userMiembro" class="text-xs uppercase tracking-widest text-accent mt-3">Miembro desde —</p>
          </div>
          <div class="grid grid-cols-3 gap-4 text-center">
            <div>
              <p id="statTotal" class="font-display text-2xl font-bold">0</p>
              <p class="text-xs uppercase tracking-wider text-gray-200">Total</p>
            </div>
            <div>
              <p id="statProximas" class="font-display text-2xl font-bold">0</p>
              <p class="text-xs uppercase tracking-wider text-gray-200">Próximas</p>
            </div>
            <div>
              <p id="statCompletadas" class="font-display text-2xl font-bold">0</p>
              <p class="text-xs uppercase tracking-wider text-gray-200">Completadas</p>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- DATOS PERSONALES -->
        <div class="lg:col-span-1">
          <div class="card p-6">
            <h3 class="font-display text-xl font-bold text-primary-dark mb-4">Datos personales</h3>
            <form id="perfilForm" class="space-y-4">
              <div>
                <label class="block text-sm font-semibold text-muted mb-2">Nombre completo</label>
                <input type="text" id="pNombre" required class="input-field"/>
              </div>
              <div>
                <label class="block text-sm font-semibold text-muted mb-2">Email</label>
                <input type="email" id="pEmail" required class="input-field"/>
              </div>
              <div>
                <label class="block text-sm font-semibold text-muted mb-2">Teléfono</label>
                <input type="tel" id="pTelefono" required class="input-field"/>
              </div>
              <button type="submit" class="btn-primary w-full">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                Guardar cambios
              </button>
            </form>
          </div>
        </div>

        <!-- HISTORIAL DE RESERVAS -->
        <div id="reservas" class="lg:col-span-2">
          <div class="flex flex-wrap gap-3 mb-6">
            <button class="filtro-reserva btn-primary text-sm py-2 px-5" data-filtro="todas">Todas</button>
            <button class="filtro-reserva btn-outline text-sm py-2 px-5" data-filtro="pendiente">Pendientes</button>
            <button class="filtro-reserva btn-outline text-sm py-2 px-5" data-filtro="confirmada">Confirmadas</button>
            <button class="filtro-reserva btn-outline text-sm py-2 px-5" data-filtro="completada">Completadas</button>
            <button class="filtro-reserva btn-outline text-sm py-2 px-5" data-filtro="cancelada">Canceladas</button>
          </div>

          <div id="reservasList" class="space-y-4"></div>

          <div id="reservasVacio" class="card p-12 text-center hidden">
            <svg class="w-16 h-16 mx-auto text-soft mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <h4 class="font-display text-xl font-bold text-primary-dark mb-2">Aún no tienes reservas</h4>
            <p class="text-muted mb-6">Cuando hagas tu primera reserva aparecerá aquí.</p>
            <a href="reserva.html" class="btn-primary">Hacer mi primera reserva</a>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div id="appFooter"></div>

  <script src="main.js"></script>
  <script>
    function initPerfil() {
      const session = Auth.requireAuth();
      if (!session) return;

      // Prellenar form
      document.getElementById('userFoto').src = session.foto || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&q=80';
      document.getElementById('userNombre').textContent = session.nombre;
      document.getElementById('userEmail').textContent = session.email;
      document.getElementById('pNombre').value = session.nombre || '';
      document.getElementById('pEmail').value = session.email || '';
      document.getElementById('pTelefono').value = session.telefono || '';

      const users = Storage.get(STORAGE_KEYS.USERS, []);
      const me = users.find(u => u.id === session.id);
      if (me && me.creado_en) {
        document.getElementById('userMiembro').textContent = `Miembro desde ${UI.formatDate(me.creado_en)}`;
      }

      // Guardar perfil
      document.getElementById('perfilForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const result = Auth.updateProfile({
          nombre: document.getElementById('pNombre').value.trim(),
          email: document.getElementById('pEmail').value.trim(),
          telefono: document.getElementById('pTelefono').value.trim()
        });
        if (result.ok) {
          UI.Toast('Perfil actualizado correctamente', 'success');
          location.reload();
        } else {
          UI.Toast(result.error, 'error');
        }
      });

      // Render reservas
      let filtroActual = 'todas';

      const renderReservas = () => {
        let reservas = Reservas.byUser(session.id);
        if (filtroActual !== 'todas') reservas = reservas.filter(r => r.estado === filtroActual);

        const $list = document.getElementById('reservasList');
        const $vacio = document.getElementById('reservasVacio');

        if (reservas.length === 0) {
          $list.innerHTML = '';
          $vacio.classList.remove('hidden');
          return;
        }
        $vacio.classList.add('hidden');

        $list.innerHTML = reservas.map(r => {
          const hab = HABITACIONES.find(h => h.id === r.habitacionId);
          const noches = Reservas.calcularNoches(r.fechaEntrada, r.fechaSalida);
          return `
            <article class="card overflow-hidden card-hover cursor-pointer" onclick="window.location.href='detalle-reserva.html?id=${r.id}'">
              <div class="flex flex-col sm:flex-row">
                <div class="sm:w-48 h-40 sm:h-auto overflow-hidden flex-shrink-0">
                  <img src="${hab.imagen}" alt="${hab.nombre}" class="w-full h-full object-cover"/>
                </div>
                <div class="p-5 flex-1">
                  <div class="flex items-start justify-between gap-3 mb-2">
                    <div>
                      <h4 class="font-display text-lg font-bold text-primary-dark">${hab.nombre}</h4>
                      <p class="text-xs text-muted">${hab.tipo === 'privada' ? 'Habitación privada' : 'Dormitorio compartido'}</p>
                    </div>
                    <span class="badge-estado badge-${r.estado}">${Reservas.estadoLabel(r.estado)}</span>
                  </div>
                  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-3 text-sm">
                    <div>
                      <p class="text-xs text-muted">Entrada</p>
                      <p class="font-semibold">${UI.formatDateShort(r.fechaEntrada)}</p>
                    </div>
                    <div>
                      <p class="text-xs text-muted">Salida</p>
                      <p class="font-semibold">${UI.formatDateShort(r.fechaSalida)}</p>
                    </div>
                    <div>
                      <p class="text-xs text-muted">Noches</p>
                      <p class="font-semibold">${noches}</p>
                    </div>
                    <div>
                      <p class="text-xs text-muted">Total</p>
                      <p class="font-bold text-primary">${UI.formatCurrency(r.total)}</p>
                    </div>
                  </div>
                  <div class="flex items-center justify-between mt-4 pt-4 border-t border-soft">
                    <p class="text-xs text-muted font-mono">${r.id}</p>
                    <span class="text-primary text-sm font-semibold flex items-center gap-1">
                      Ver detalle
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </span>
                  </div>
                </div>
              </div>
            </article>
          `;
        }).join('');
      };

      // Stats
      const todasReservas = Reservas.byUser(session.id);
      const hoy = UI.todayISO();
      document.getElementById('statTotal').textContent = todasReservas.length;
      document.getElementById('statProximas').textContent = todasReservas.filter(r => r.fechaEntrada >= hoy && r.estado !== 'cancelada').length;
      document.getElementById('statCompletadas').textContent = todasReservas.filter(r => r.estado === 'completada').length;

      renderReservas();

      document.querySelectorAll('.filtro-reserva').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filtro-reserva').forEach(b => {
            b.classList.remove('btn-primary'); b.classList.add('btn-outline');
          });
          btn.classList.remove('btn-outline'); btn.classList.add('btn-primary');
          filtroActual = btn.dataset.filtro;
          renderReservas();
        });
      });

      // Si la URL tiene #reservas, scroll
      if (window.location.hash === '#reservas') {
        setTimeout(() => document.getElementById('reservas').scrollIntoView({ behavior: 'smooth' }), 100);
      }
    }
  </script>
</body>
</html>
